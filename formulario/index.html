<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    
    <title>Sistema de Talentos - Cadastro e Consulta</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{
      --primary-color: #4a90e2;
      --primary-hover: #357abd;
      --bg-color: #f4f7f6;
    
    }

    body{
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      padding: 2rem 0;
    }

    /* Centraliza e limita a largura dos cards*/
    .main-container{
      max-width: 650px;
      margin: 0 auto;
    }
    .card-custom{
      background: #fff;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 1);
      margin-bottom: 2rem;/*Espaço entre os cards*/
    }

    h2{
      color: var(--primary-color); margin-bottom: 1.5rem;
    }
    .btn-primary{background-color: var(--primary-color); border: none;}
    .btn-primary:hover { background-color: var(--primary-hover);}

    #tabelaResultado{ display: none;}
    .instrucoes{font-size: 0.9rem; color: #666;}
    
  </style>
</head>
<body>
  <div class="container">
    <div class="main-container">
      <!--seção de cadastro (em cima)-->
      <div class="card-custom">
        <h2>Ficha Cadastral</h2>
        <p class="Instrucoes">Preencha os campos abaixo para entrar em nosso banco de talentos</p>

        <form action="process.php" method="post" id="formCadastro">
          
          <div class="mb-3">
            <label class=""form-label">Nome Completo</label>
            <input type="text" name="nome" id="nomeDigitado" class="form-control" placeholder="Seu nome">
          </div>
          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" name="email" id="emailDigitado" class="form-control" placeholder="exemplo@email.com">

          </div>  
          <div class="mb-3">
            <label class="form-label">Endereço</label>
            <input type="endereco" name="endereco" id="enderecoDigitado" class="form-control" placeholder="Rua, Número, Bairro">
          </div> 
          <button type="submit" class="btn btn-primary w-100" onclick="return validarFormulario()">Cadastrar</button> 
        </form>

      </div>
    </div>
  </div>
    
</body>
</html>
